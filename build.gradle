plugins {
	id "net.fabricmc.fabric-loom" version "${loom_version}"
	id "maven-publish"
}

version = project.mod_version
group = project.maven_group
def testClientUsername = providers.gradleProperty("pixelTzzUsername").getOrElse("Player972")
def knownTestClientRunDirs = [
	"Player972": "run/client",
	"PlayerB": "run/client-b",
	"PlayerC": "run/client-c",
	"PlayerD": "run/client-PlayerD",
	"PlayerE": "run/client-PlayerE"
]
def testClientRunDir = knownTestClientRunDirs.getOrDefault(
	testClientUsername,
	"run/client-${testClientUsername.replaceAll("[^A-Za-z0-9._-]", "_")}"
)
def testClientWindowWidth = providers.gradleProperty("pixelTzzWindowWidth").getOrElse("2560")
def testClientWindowHeight = providers.gradleProperty("pixelTzzWindowHeight").getOrElse("1440")

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = "Aliyun Public"
		url = uri("https://maven.aliyun.com/repository/public")
	}
	maven {
		name = "Aliyun Central"
		url = uri("https://maven.aliyun.com/repository/central")
	}
	maven {
		name = "Fabric"
		url = uri("https://maven.fabricmc.net/")
	}
	maven {
		name = "Mojang"
		url = uri("https://libraries.minecraft.net/")
	}
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	runs {
		client {
			runDir testClientRunDir
			programArgs(
				"--username", testClientUsername,
				"--width", testClientWindowWidth,
				"--height", testClientWindowHeight
			)
		}
		server {
			runDir "run/server"
		}
	}

	mods {
		"pixel-tzz-pro" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

def expandedProperties = [
		"version": project.version,
		"minecraft_version": project.minecraft_version,
		"loader_version": project.loader_version
]

processResources {
	inputs.properties expandedProperties
	filteringCharset = "UTF-8"

	filesMatching("fabric.mod.json") {
		expand expandedProperties
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = "UTF-8"
	options.release = 25
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
	withSourcesJar()
}

def archiveBaseName = base.archivesName.get()

jar {
	from("LICENSE") {
		rename { "${it}_${archiveBaseName}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
}

